<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      RA Demo: Dedo con círculo
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="camera-ra-wrapper" [style.aspect-ratio]="cameraAspectRatio">
    <video #videoEl autoplay playsinline muted class="camera-ra-video"></video>
    <canvas #overlayEl class="camera-ra-canvas"></canvas>
  </div>

  <div class="camera-meta">
    <strong>Fuente:</strong> Cámara predeterminada del computador
  </div>
  <div class="camera-meta">
    <strong>Seguimiento:</strong> {{ detectionStatus }}
  </div>

  <ion-button expand="block" (click)="startRA()" [disabled]="isStarting || cameraReady">
    {{ isStarting ? startupStatus : cameraReady ? 'Cámara activa' : 'Iniciar RA' }}
  </ion-button>
  <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>
</ion-content>
